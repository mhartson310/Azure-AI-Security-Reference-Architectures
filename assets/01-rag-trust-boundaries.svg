<rect width="1600" height="1040" fill="url(#bg)"/>
<rect x="42" y="32" width="1516" height="122" rx="23" fill="white" stroke="#BEDFF4" stroke-width="2"/>
<rect x="64" y="52" width="88" height="88" rx="21" fill="#0078D4"/><text x="108" y="108" text-anchor="middle" font-family="Segoe UI,Arial" font-size="43" font-weight="800" fill="white">01</text>
<text x="174" y="86" font-family="Segoe UI,Arial" font-size="42" font-weight="800" fill="#102A43">Secure Enterprise RAG — Version 2</text>
<text x="174" y="128" font-family="Segoe UI,Arial" font-size="24" fill="#24628F">Identity-aware retrieval  •  Independent permission checks  •  Governed model context</text>
<text x="57" y="201" font-family="Segoe UI,Arial" font-size="24" font-weight="800" fill="#0078D4">REQUEST PATH — TRUST BOUNDARIES IN BLUE</text>
<rect x="54" y="233" width="267" height="197" rx="22" fill="white" stroke="#70BCE9" stroke-width="2"/><rect x="54" y="233" width="267" height="58" rx="21" fill="url(#bl)"/><rect x="54" y="272" width="267" height="19" fill="url(#bl)"/><text x="76" y="269" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">1. User &amp; Entra ID</text><text x="73" y="344" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#102A43">Token validation</text><text x="73" y="379" font-family="Segoe UI,Arial" font-size="18" fill="#416886">User + tenant identity</text><path d="M326 334 h25 m-11-10 11 10-11 10" fill="none" stroke="#0078D4" stroke-width="5" stroke-linecap="round"/><rect x="360" y="233" width="267" height="197" rx="22" fill="white" stroke="#70BCE9" stroke-width="2"/><rect x="360" y="233" width="267" height="58" rx="21" fill="url(#bl)"/><rect x="360" y="272" width="267" height="19" fill="url(#bl)"/><text x="382" y="269" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">2. Application / API</text><text x="379" y="344" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#102A43">Authorize request</text><text x="379" y="379" font-family="Segoe UI,Arial" font-size="18" fill="#416886">Build scoped search</text><path d="M632 334 h25 m-11-10 11 10-11 10" fill="none" stroke="#0078D4" stroke-width="5" stroke-linecap="round"/><rect x="666" y="233" width="267" height="197" rx="22" fill="white" stroke="#70BCE9" stroke-width="2"/><rect x="666" y="233" width="267" height="58" rx="21" fill="url(#bl)"/><rect x="666" y="272" width="267" height="19" fill="url(#bl)"/><text x="688" y="269" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">3. Azure AI Search</text><text x="685" y="344" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#102A43">Tenant + ACL filters</text><text x="685" y="379" font-family="Segoe UI,Arial" font-size="18" fill="#416886">Candidate snippets</text><path d="M938 334 h25 m-11-10 11 10-11 10" fill="none" stroke="#0078D4" stroke-width="5" stroke-linecap="round"/><rect x="972" y="233" width="267" height="197" rx="22" fill="white" stroke="#70BCE9" stroke-width="2"/><rect x="972" y="233" width="267" height="58" rx="21" fill="url(#bl)"/><rect x="972" y="272" width="267" height="19" fill="url(#bl)"/><text x="994" y="269" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">4. Independent ACL</text><text x="991" y="344" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#102A43">Check current rights</text><text x="991" y="379" font-family="Segoe UI,Arial" font-size="18" fill="#416886">Reject stale or denied</text><path d="M1244 334 h25 m-11-10 11 10-11 10" fill="none" stroke="#0078D4" stroke-width="5" stroke-linecap="round"/><rect x="1278" y="233" width="267" height="197" rx="22" fill="white" stroke="#70BCE9" stroke-width="2"/><rect x="1278" y="233" width="267" height="58" rx="21" fill="url(#bl)"/><rect x="1278" y="272" width="267" height="19" fill="url(#bl)"/><text x="1300" y="269" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">5. Foundry model</text><text x="1297" y="344" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#102A43">Authorized context</text><text x="1297" y="379" font-family="Segoe UI,Arial" font-size="18" fill="#416886">Constrained citations</text><rect x="49" y="473" width="1502" height="145" rx="22" fill="white" stroke="#9AD1F1" stroke-width="2"/>
<rect x="49" y="473" width="1502" height="47" rx="21" fill="url(#bl)"/><rect x="49" y="502" width="1502" height="19" fill="url(#bl)"/>
<text x="68" y="505" font-family="Segoe UI,Arial" font-size="23" font-weight="800" fill="white">INGESTION + DATA TRUST BOUNDARY — A SEPARATE APPROVED WORKFLOW</text>
<text x="77" y="562" font-family="Segoe UI,Arial" font-size="22" fill="#102A43">SharePoint / Blob / ADLS → trusted ingestion identity → extraction/chunking + ACL provenance → Search index</text>
<text x="77" y="596" font-family="Segoe UI,Arial" font-size="19" fill="#3A6A8C">Permission changes and source deletion must trigger refresh or an authoritative per-request check.</text>
<text x="57" y="672" font-family="Segoe UI,Arial" font-size="25" font-weight="800" fill="#0078D4">TRUST-BOUNDARY / CONTROL OWNERSHIP</text><rect x="51" y="696" width="364" height="80" rx="16" fill="white" stroke="#B5DEFA"/><rect x="61" y="712" width="71" height="44" rx="14" fill="#0078D4"/><text x="96" y="741" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">TB-1</text><text x="141" y="729" font-family="Segoe UI,Arial" font-size="18" font-weight="800" fill="#102A43">Client ↔ ingress</text><text x="141" y="754" font-family="Segoe UI,Arial" font-size="16" fill="#356A8E">Authenticate user request</text><rect x="434" y="696" width="364" height="80" rx="16" fill="white" stroke="#B5DEFA"/><rect x="444" y="712" width="71" height="44" rx="14" fill="#0078D4"/><text x="479" y="741" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">TB-2</text><text x="524" y="729" font-family="Segoe UI,Arial" font-size="18" font-weight="800" fill="#102A43">Ingress ↔ app policy</text><text x="524" y="754" font-family="Segoe UI,Arial" font-size="16" fill="#356A8E">Validated user + tenant</text><rect x="817" y="696" width="364" height="80" rx="16" fill="white" stroke="#B5DEFA"/><rect x="827" y="712" width="71" height="44" rx="14" fill="#0078D4"/><text x="862" y="741" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">TB-3</text><text x="907" y="729" font-family="Segoe UI,Arial" font-size="18" font-weight="800" fill="#102A43">Source ↔ ingestion</text><text x="907" y="754" font-family="Segoe UI,Arial" font-size="16" fill="#356A8E">Source ACL provenance</text><rect x="1200" y="696" width="364" height="80" rx="16" fill="white" stroke="#B5DEFA"/><rect x="1210" y="712" width="71" height="44" rx="14" fill="#0078D4"/><text x="1245" y="741" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">TB-4</text><text x="1290" y="729" font-family="Segoe UI,Arial" font-size="18" font-weight="800" fill="#102A43">App ↔ Search</text><text x="1290" y="754" font-family="Segoe UI,Arial" font-size="16" fill="#356A8E">Tenant + ACL filters</text><rect x="51" y="793" width="364" height="80" rx="16" fill="white" stroke="#B5DEFA"/><rect x="61" y="809" width="71" height="44" rx="14" fill="#0078D4"/><text x="96" y="838" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">TB-5</text><text x="141" y="826" font-family="Segoe UI,Arial" font-size="18" font-weight="800" fill="#102A43">Search ↔ context</text><text x="141" y="851" font-family="Segoe UI,Arial" font-size="16" fill="#356A8E">Independent ACL check</text><rect x="434" y="793" width="364" height="80" rx="16" fill="white" stroke="#B5DEFA"/><rect x="444" y="809" width="71" height="44" rx="14" fill="#0078D4"/><text x="479" y="838" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">TB-6</text><text x="524" y="826" font-family="Segoe UI,Arial" font-size="18" font-weight="800" fill="#102A43">Context ↔ model</text><text x="524" y="851" font-family="Segoe UI,Arial" font-size="16" fill="#356A8E">Untrusted source content</text><rect x="817" y="793" width="364" height="80" rx="16" fill="white" stroke="#B5DEFA"/><rect x="827" y="809" width="71" height="44" rx="14" fill="#0078D4"/><text x="862" y="838" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" font-weight="800" fill="white">TB-7</text><text x="907" y="826" font-family="Segoe UI,Arial" font-size="18" font-weight="800" fill="#102A43">Runtime ↔ logs</text><text x="907" y="851" font-family="Segoe UI,Arial" font-size="16" fill="#356A8E">Sanitized audit events</text><rect x="53" y="914" width="1496" height="73" rx="21" fill="#E5F4FF" stroke="#A8D9F8"/><text x="78" y="952" font-family="Segoe UI,Arial" font-size="24" font-weight="800" fill="#064B87">SECURITY INVARIANT:</text><text x="353" y="952" font-family="Segoe UI,Arial" font-size="24" fill="#102A43">Unauthorized document text must never enter the model context.</text><text x="57" y="1020" font-family="Segoe UI,Arial" font-size="18" fill="#547D9A">THE CLOUD SECURITY ARCHITECT | Conceptual security architecture — Azure lab validation pending.</text></svg>